<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laufen">
<meta name="theme-color" content="#10241b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Laufen</title>
<style>
:root{--bg:#07130f;--card:#13291f;--card2:#183426;--line:#365c49;--green:#37c978;--red:#a74747;--gold:#efbd45;--cream:#f4ead5;--muted:#9eaaa4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29483a 0,#0c2118 25%,var(--bg) 60%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:700px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom))}
h1{margin:0;text-align:center;font-size:30px;color:var(--cream)}.sub{text-align:center;color:var(--gold);font-weight:800;font-size:18px;margin:4px 0 15px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 26px #0005}
button,input,select{width:100%;font:inherit;border-radius:13px;padding:13px}button{border:0;font-weight:800;background:var(--cream);color:#132019;cursor:pointer}button:active{transform:scale(.985)}
input,select{background:#0d1b15;color:#fff;border:1px solid var(--line);margin:5px 0 9px}
label{font-size:13px;color:var(--muted)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.top{display:grid;grid-template-columns:1fr 1fr;gap:9px}.top button,.secondary{background:#213b30;color:#fff;border:1px solid #416352}
.mode button{background:#243d32;color:#fff;border:1px solid var(--line)}.mode .selected{background:var(--green);color:#07150d}
.center{text-align:center}.target{font-size:72px;font-weight:900;line-height:1;margin:12px 0 8px}.muted{color:var(--muted)}
.badge{display:inline-block;background:#28523c;color:#aef0c7;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;margin-top:7px}.badge.risk{background:#5a421b;color:#ffe29a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{min-height:59px}.miss{background:#663333;color:#ffe1e1}.bull{background:var(--gold);color:#271e07}.next{margin-top:9px;background:#292a31;color:#fff}
.event{min-height:20px;text-align:center;color:#ffd16a;font-weight:800;margin-top:6px}.player{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px;border-bottom:1px solid #304c40}.player:last-child{border:0}.active{outline:2px solid var(--green);border-radius:13px;background:#183426}.safe{color:#7ee6a6;font-size:12px}.riskText{color:#ffd16a;font-size:12px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pick button{padding:10px 3px}.flashHit{animation:hit .55s}.flashMiss{animation:miss .55s}
@keyframes hit{35%{background:#236f43;box-shadow:0 0 28px #35d47b88}}@keyframes miss{35%{background:#743535;box-shadow:0 0 28px #e45d5d88}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 4px;border-bottom:1px solid #315043;text-align:left}th:nth-child(n+3),td:nth-child(n+3){text-align:right}
</style>
</head><body><div class="wrap">
<h1>🎯 Laufen 🎯</h1><div class="sub">20 → Bullseye</div>

<div id="setup" class="card">
<label>Spielmodus</label>
<div class="grid mode"><button id="simpleBtn" class="selected" onclick="setMode('simple')">Einfach</button><button id="advancedBtn" onclick="setMode('advanced')">Erweitert</button></div>
<div id="modeInfo" class="muted" style="margin:7px 0 13px">Klassische Variante bis Bullseye.</div>
<label>Spieleranzahl</label><select id="count"></select><div id="names"></div>
<button onclick="startGame()">Spiel starten</button>
</div>

<div id="game" class="hidden">
<div class="top"><button onclick="undo()">↶ Rückgängig</button><button onclick="newGame()">Neues Spiel</button></div>
<div id="mainCard" class="card center">
<div id="turn"></div><div id="stage" class="badge"></div><div id="target" class="target"></div>
<div id="hint" class="muted"></div><div id="throwInfo" class="muted"></div><div id="event" class="event"></div>
</div>
<div id="actions"></div>
<button id="nextPlayerBtn" class="next" onclick="nextPlayer()">Nächster Spieler →</button>
<div id="players" class="card"></div>
</div>

<div id="end" class="hidden">
<div class="card"><h2 id="winner" class="center"></h2><div id="ranking"></div></div>
<div class="top"><button onclick="undoWin()">↶ Rückgängig</button><button onclick="nextRound()">Nächstes Spiel</button></div>
<button class="secondary" style="margin-top:9px" onclick="newGame()">Neues Spiel</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let selectedMode='simple',S=null,H=[];

for(let i=1;i<=6;i++)$('count').innerHTML+=`<option ${i===2?'selected':''}>${i}</option>`;
$('count').onchange=renderNames;renderNames();

function renderNames(){ $('names').innerHTML=''; for(let i=0;i<+$('count').value;i++) $('names').innerHTML+=`<input id="n${i}" value="Spieler ${i+1}">`; }
function setMode(m){selectedMode=m;$('simpleBtn').classList.toggle('selected',m==='simple');$('advancedBtn').classList.toggle('selected',m==='advanced');$('modeInfo').textContent=m==='simple'?'Klassische Variante bis Bullseye.':'Nach Single Bull: Bullseye spielen oder direkt mit S20 / D20 / T20 in die zweite Leiter einsteigen.'}

function makePlayer(i){return{name:$(`n${i}`).value||`Spieler ${i+1}`,pos:20,checkpoint:20,stage:1,challenge:null,pending:null,choice:null,points:0,roundThrows:0,winThrows:0,wins:0,sbThisTurn:0}}
function startGame(){let p=[];for(let i=0;i<+$('count').value;i++)p.push(makePlayer(i));S={mode:selectedMode,p,current:0,dart:0,round:1,over:false,picker:null,msg:''};H=[];$('setup').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render();}
function save(){H.push(JSON.stringify(S))}
function checkpointReturn(p){if(p.stage===2)return 20;if(p.checkpoint===13)return 12;if(p.checkpoint===6)return 5;return 20}
function targetText(p){if(p.challenge)return p.choice?`${p.challenge}${p.choice}`:(p.challenge==='D'?'Doppel wählen':'Triple wählen');return p.pos>0?String(p.pos):p.pos===0?'SB':'BULL'}
function crossed(old,step,n){return old>=n&&old-step<n}

// Only the EXACT resulting number eliminates another player.
// Skipped intermediate numbers never eliminate.
function eliminateExact(number,shooter){
 if(number<0)return[];
 let out=[];
 S.p.forEach((q,i)=>{
   if(i===shooter||q.pos<0||q.challenge)return;
   if(q.pos===number){q.pos=checkpointReturn(q);q.challenge=null;q.pending=null;q.choice=null;q.sbThisTurn=0;out.push(`${q.name} → ${q.pos}`)}
 });
 return out;
}

function flash(miss){let c=$('mainCard');c.classList.remove('flashHit','flashMiss');void c.offsetWidth;c.classList.add(miss?'flashMiss':'flashHit');setTimeout(()=>c.classList.remove('flashHit','flashMiss'),550)}
function activatePendingForCurrent(){let p=S.p[S.current];if(p.pending){p.challenge=p.pending;p.pending=null;p.choice=null;S.picker=(S.current-1+S.p.length)%S.p.length}}
function finishTurn(){S.p[S.current].sbThisTurn=0;S.dart=0;S.current=(S.current+1)%S.p.length;activatePendingForCurrent()}
function win(){let p=S.p[S.current];p.points++;p.wins++;p.winThrows+=p.roundThrows;S.over=true}
function showEnd(){ $('game').classList.add('hidden');$('end').classList.remove('hidden');$('winner').textContent=`🏆 ${S.p[S.current].name} gewinnt Runde ${S.round}`;$('ranking').innerHTML=rankingTable(); }

// S20/D20/T20 on BULL is the actual next dart and starts ladder 2.
function startSecond(type){
 if(!S||S.over)return;
 save();let p=S.p[S.current];p.stage=2;p.pos=20;p.checkpoint=20;p.challenge=null;p.pending=null;p.choice=null;p.sbThisTurn=0;
 p.roundThrows++;S.dart++;
 let step=type==='S'?1:type==='D'?2:3;
 p.pos=20-step;
 let victims=eliminateExact(p.pos,S.current);
 S.msg=victims.length?`💥 ${victims.join(', ')}`:'⚡ Zweite Leiter gestartet';
 flash(false);
 if(S.dart>=3)finishTurn();
 render();
}

function chooseChallenge(n){save();let p=S.p[S.current];p.choice=n;S.picker=null;S.msg=`${p.name} muss ${p.challenge}${n} treffen`;render()}

function throwDart(type){
 if(!S||S.over||S.picker!==null)return;
 save();let p=S.p[S.current];p.roundThrows++;S.dart++;S.msg='';
 let miss=type==='M';

 // In ladder 2 Bullseye is always an immediate win.
 if(type==='B' && (p.pos<=0 || (S.mode==='advanced'&&p.stage===2))){win();flash(false);showEnd();return}

 if(p.challenge){
   if(type===p.challenge){p.challenge=null;p.choice=null}
 } else if(p.pos>0){
   let step=type==='S'?1:type==='D'?2:type==='T'?3:0;
   if(step){
     let old=p.pos,newPos=Math.max(0,old-step);p.pos=newPos;
     let victims=eliminateExact(newPos,S.current);if(victims.length)S.msg=`💥 ${victims.join(', ')}`;
     if(p.stage===1&&crossed(old,step,13)&&p.checkpoint===20){
       p.checkpoint=13;p.pos=12;
       if(S.dart===3)p.pending='D';else{p.challenge='D';S.picker=(S.current-1+S.p.length)%S.p.length}
     }else if(p.stage===1&&crossed(old,step,6)&&p.checkpoint===13){
       p.checkpoint=6;p.pos=5;
       if(S.dart===3)p.pending='T';else{p.challenge='T';S.picker=(S.current-1+S.p.length)%S.p.length}
     }
   }
 } else if(p.pos===0 && type==='SB'){
   if(S.mode==='advanced'&&p.stage===2){win();flash(false);showEnd();return}
   p.sbThisTurn++;p.pos=-1;
   if(p.sbThisTurn>=3){win();flash(false);showEnd();return}
 } else if(p.pos<0 && type==='SB'){
   p.sbThisTurn++;
   if(p.sbThisTurn>=3){win();flash(false);showEnd();return}
 }

 flash(miss);
 if(S.picker!==null){render();return}
 if(S.dart>=3)finishTurn();
 render();
}

function nextPlayer(){if(!S||S.over||S.picker!==null)return;save();finishTurn();S.msg='';render()}

function actionsHTML(p){
 if(S.picker!==null){
   let picker=S.p[S.picker],word=p.challenge==='D'?'Doppel':'Triple';
   return `<div class="card center"><b>${picker.name}</b> bestimmt das ${word} für <b>${p.name}</b><div class="pick">${Array.from({length:20},(_,i)=>`<button onclick="chooseChallenge(${i+1})">${p.challenge}${i+1}</button>`).join('')}</div></div>`;
 }
 if(p.challenge&&p.choice)return `<div class="actions"><button class="miss" onclick="throwDart('M')">✕ Miss</button><button onclick="throwDart('${p.challenge}')">${p.challenge}${p.choice} getroffen</button></div>`;
 if(p.pos>0){
   let bull=(S.mode==='advanced'&&p.stage===2)?`<button class="bull" style="grid-column:1/-1" onclick="throwDart('B')">🎯 Bullseye</button>`:'';
   return `<div class="actions"><button class="miss" onclick="throwDart('M')">✕ Miss</button><button onclick="throwDart('S')">Single ${p.pos}</button><button onclick="throwDart('D')">Double ${p.pos}</button><button onclick="throwDart('T')">Triple ${p.pos}</button>${bull}</div>`;
 }
 if(p.pos===0)return `<div class="actions"><button class="miss" onclick="throwDart('M')">✕ Miss</button><button onclick="throwDart('SB')">Single Bull</button><button class="bull" style="grid-column:1/-1" onclick="throwDart('B')">🎯 Bullseye</button></div>`;

 // Player has hit Single Bull and currently needs Bullseye.
 // In advanced mode, S20/D20/T20 are shown directly and start ladder 2.
 if(S.mode==='advanced'&&p.stage===1)return `<div class="actions">
   <button class="miss" onclick="throwDart('M')">✕ Miss</button><button onclick="throwDart('SB')">Single Bull</button>
   <button class="bull" style="grid-column:1/-1" onclick="throwDart('B')">🎯 Bullseye</button>
   <button onclick="startSecond('S')">Single 20</button><button onclick="startSecond('D')">Double 20</button>
   <button onclick="startSecond('T')" style="grid-column:1/-1">Triple 20</button></div>`;
 return `<div class="actions"><button class="miss" onclick="throwDart('M')">✕ Miss</button><button onclick="throwDart('SB')">Single Bull</button><button class="bull" onclick="throwDart('B')">🎯 Bullseye</button></div>`;
}
function avg(p){return p.wins?(p.winThrows/p.wins).toFixed(1):'–'}
function render(){
 let p=S.p[S.current];
 $('turn').textContent=S.picker!==null?`${S.p[S.picker].name} wählt für ${p.name}`:`Runde ${S.round} · ${p.name} ist dran`;
 $('stage').textContent=S.mode==='advanced'?(p.stage===1?'1. Leiter':'2. Leiter · Risiko'):'Einfach';$('stage').classList.toggle('risk',p.stage===2);
 $('target').textContent=targetText(p);
 $('hint').textContent=p.challenge?(p.choice?`Pflichtfeld ${p.challenge}${p.choice}`:'Pflichtfeld wird bestimmt'):p.pos>0?`Treffe die ${p.pos}`:p.pos===0?'Single Bull oder Bullseye':'Treffe Bullseye';
 $('throwInfo').textContent=`Wurf ${S.dart+1}/3 · diese Runde: ${p.roundThrows}`;$('event').textContent=S.msg;
 $('actions').innerHTML=actionsHTML(p);$('nextPlayerBtn').classList.toggle('hidden',S.picker!==null);
 $('players').innerHTML=S.p.map((x,i)=>`<div class="player ${i===S.current?'active':''}"><span><b>${x.name}</b><br><span class="muted">Ziel ${targetText(x)}</span><br><span class="${x.stage===2?'riskText':'safe'}">${S.mode==='advanced'?(x.stage===1?'1. Leiter':'2. Leiter · ohne Safe'):`Sicher: ${x.checkpoint===20?'Start':x.checkpoint}`}</span></span><span>${x.points} P.<br><span class="muted">Ø Sieg: ${avg(x)}</span></span></div>`).join('');
}
function ranked(){return [...S.p].sort((a,b)=>b.points-a.points-(0)||((a.wins?a.winThrows/a.wins:Infinity)-(b.wins?b.winThrows/b.wins:Infinity)))}
function rankingTable(){return `<table><tr><th>#</th><th>Spieler</th><th>Punkte</th><th>Ø Würfe/Sieg</th></tr>${ranked().map((p,i)=>`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.points}</td><td>${avg(p)}</td></tr>`).join('')}</table>`}
function undo(){if(!H.length)return;S=JSON.parse(H.pop());S.over=false;$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}
function undoWin(){undo()}
function nextRound(){S.round++;S.over=false;S.dart=0;S.picker=null;S.msg='';S.p.forEach(p=>{p.pos=20;p.checkpoint=20;p.stage=1;p.challenge=null;p.pending=null;p.choice=null;p.roundThrows=0;p.sbThisTurn=0});H=[];$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}
function newGame(){S=null;H=[];$('game').classList.add('hidden');$('end').classList.add('hidden');$('setup').classList.remove('hidden')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
