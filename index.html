<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Laufen"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Laufen</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:650px;margin:auto;padding:20px 15px}h1{margin:0}.sub,.muted{color:#999}.card{background:#1a1a1f;border:1px solid #333;border-radius:18px;padding:15px;margin:12px 0}input,select,button{width:100%;padding:13px;margin:5px 0;border-radius:12px;font-size:16px}input,select{background:#111;color:white;border:1px solid #333}button{border:0;font-weight:700}.hidden{display:none}.target{text-align:center;font-size:72px;font-weight:900}.center{text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.miss{background:#35353d;color:white}.row{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #333}.active{outline:2px solid white;border-radius:10px}.top{display:flex;gap:8px}.top button{background:#292930;color:white}table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid #333;text-align:left}td:nth-child(n+3),th:nth-child(n+3){text-align:right}
</style></head><body><div class="w"><h1>🎯 Laufen</h1><div class="sub">20 → 1 → Single Bull → Bullseye</div>
<div id="setup" class="card"><label>Spieleranzahl</label><select id="count"></select><div id="names"></div><button onclick="start()">Spiel starten</button></div>
<div id="game" class="hidden"><div class="top"><button onclick="undo()">↶ Rückgängig</button><button onclick="location.reload()">Neues Spiel</button></div><div class="card center"><div id="who"></div><div id="target" class="target"></div><div id="hint" class="muted"></div><div id="throws" class="muted"></div></div><div id="actions" class="grid"></div><div id="plist" class="card"></div></div>
<div id="end" class="hidden"><div class="card"><h2 id="winner" class="center"></h2><div id="table"></div></div><button onclick="nextRound()">Nächste Runde</button></div>
</div><script>
let S=null,H=[],$=x=>document.getElementById(x);for(let i=1;i<=6;i++)count.innerHTML+=`<option ${i==2?'selected':''}>${i}</option>`;
function fields(){names.innerHTML='';for(let i=0;i<+count.value;i++)names.innerHTML+=`<input id="n${i}" value="Spieler ${i+1}">`}count.onchange=fields;fields();
function start(){let p=[];for(let i=0;i<+count.value;i++)p.push({name:$('n'+i).value||`Spieler ${i+1}`,pos:20,points:0,total:0,round:0});S={p,current:0,dart:0,rnd:1,over:false};setup.classList.add('hidden');game.classList.remove('hidden');render()}
function tgt(p){return p.pos>0?p.pos:p.pos==0?'SB':'BULL'}
function hit(k){H.push(JSON.stringify(S));let p=S.p[S.current];p.total++;p.round++;S.dart++;
 if(p.pos>0){let n=k=='S'?1:k=='D'?2:k=='T'?3:0;if(n)p.pos=Math.max(0,p.pos-n)}
 else if(p.pos==0){if(k=='SB')p.pos=-1;else if(k=='B')win()}
 else if(k=='B')win();
 if(!S.over&&S.dart>=3){S.dart=0;S.current=(S.current+1)%S.p.length}if(S.over)roundEnd();else render()}
function win(){S.p[S.current].points++;S.over=true}
function acts(p){if(p.pos>0)return `<button class="miss" onclick="hit('M')">✕ Miss</button><button onclick="hit('S')">Single ${p.pos}</button><button onclick="hit('D')">Double ${p.pos}</button><button onclick="hit('T')">Triple ${p.pos}</button>`;
if(p.pos==0)return `<button class="miss" onclick="hit('M')">✕ Miss</button><button onclick="hit('SB')">Single Bull</button><button style="grid-column:1/-1" onclick="hit('B')">🎯 Bullseye</button>`;
return `<button class="miss" onclick="hit('M')">✕ Miss</button><button onclick="hit('B')">🎯 Bullseye</button>`}
function render(){let p=S.p[S.current];who.textContent=`Runde ${S.rnd} · ${p.name} ist dran`;target.textContent=tgt(p);hint.textContent=p.pos>0?`Treffe die ${p.pos}`:p.pos==0?'Single Bull oder direkt Bullseye':'Treffe Bullseye';throws.textContent=`Wurf ${S.dart+1}/3 · Runde ${p.round} · Gesamt ${p.total}`;actions.innerHTML=acts(p);plist.innerHTML=S.p.map((x,i)=>`<div class="row ${i==S.current?'active':''}"><span><b>${x.name}</b><br><span class="muted">Ziel ${tgt(x)}</span></span><span>${x.points} P.<br><span class="muted">${x.total} Würfe</span></span></div>`).join('')}
function rank(){return [...S.p].sort((a,b)=>b.points-a.points||a.total-b.total)}
function tab(){return `<table><tr><th>#</th><th>Spieler</th><th>Punkte</th><th>Würfe</th></tr>${rank().map((p,i)=>`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.points}</td><td>${p.total}</td></tr>`).join('')}</table>`}
function roundEnd(){game.classList.add('hidden');end.classList.remove('hidden');winner.textContent=`🏆 ${S.p[S.current].name} gewinnt Runde ${S.rnd}`;table.innerHTML=tab()}
function nextRound(){S.rnd++;S.over=false;S.dart=0;S.p.forEach(p=>{p.pos=20;p.round=0});H=[];end.classList.add('hidden');game.classList.remove('hidden');render()}
function undo(){if(H.length){S=JSON.parse(H.pop());render()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
